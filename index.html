<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101923" />
    <meta name="description" content="A vivid procedural physics sandbox rendered directly with WebGL 2." />
    <title>PROC/GEN — painterly physics playground</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101923;
        color: #f3f3e8;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #101923; }
      button { color: inherit; font: inherit; }
      #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      .topbar {
        position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px;
        display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; pointer-events: none;
      }
      .brand, .readout, .map-frame, .controls, .debug {
        border: 1px solid rgba(224, 237, 222, .16); background: rgba(9, 16, 23, .74);
        box-shadow: 0 10px 34px rgba(0, 0, 0, .24); backdrop-filter: blur(12px);
      }
      .brand { padding: 11px 14px; border-radius: 12px; }
      .brand strong { display: block; color: #a7ff90; font-size: 13px; letter-spacing: .2em; }
      .brand span { display: block; margin-top: 3px; color: #bdc9c4; font-size: 11px; }
      .readout { max-width: min(760px, 65vw); padding: 10px 13px; border-radius: 10px; color: #e1e6dc; font-size: 12px; line-height: 1.5; text-align: right; }
      #status { color: #d9e2d8; }
      .header-actions { display: flex; gap: 7px; justify-content: flex-end; margin-top: 6px; pointer-events: auto; }
      .small-button { border: 1px solid rgba(220,240,220,.2); border-radius: 999px; padding: 5px 10px; background: rgba(255,255,255,.07); cursor: pointer; font-size: 11px; }
      .small-button:hover { background: rgba(167,255,144,.15); border-color: rgba(167,255,144,.5); }
      .map-frame { position: fixed; z-index: 2; right: 16px; bottom: 16px; padding: 5px; border-radius: 10px; pointer-events: none; }
      #minimap { display: block; width: 148px; height: 148px; border-radius: 6px; }
      .controls { position: fixed; z-index: 2; left: 16px; bottom: 16px; width: min(470px, calc(100vw - 200px)); padding: 11px 13px; border-radius: 10px; color: #d0d9d1; font-size: 11px; line-height: 1.55; pointer-events: none; }
      .controls strong { color: #dfff94; font-weight: 600; }
      .debug { position: fixed; z-index: 3; left: 16px; top: 106px; max-width: min(500px, calc(100vw - 32px)); margin: 0; padding: 9px 11px; border-radius: 8px; color: #abf6d5; font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
      #banner { position: fixed; z-index: 2; left: 50%; top: 31%; transform: translate(-50%, -50%); color: #fff4bd; font-size: clamp(22px, 5vw, 46px); font-weight: 750; letter-spacing: .04em; text-align: center; text-shadow: 0 3px 22px #182321; pointer-events: none; }
      .crosshair { position: fixed; z-index: 2; top: 50%; left: 50%; width: 20px; height: 20px; margin: -10px; pointer-events: none; opacity: .88; filter: drop-shadow(0 1px 3px #101923); }
      .crosshair::before, .crosshair::after { content: ""; position: absolute; background: #f1ffe2; border-radius: 3px; }
      .crosshair::before { left: 9px; top: 2px; width: 2px; height: 16px; }
      .crosshair::after { left: 2px; top: 9px; width: 16px; height: 2px; }
      #fault { position: fixed; z-index: 10; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(680px, calc(100vw - 28px)); padding: 13px 16px; border: 1px solid #ff8d75; border-radius: 10px; background: rgba(89, 24, 25, .96); color: #fff; font-size: 13px; line-height: 1.45; }
      .mobile-controls { display: none; }
      [hidden] { display: none !important; }
      @media (max-width: 900px) {
        .topbar { left: 10px; right: 10px; top: max(10px, env(safe-area-inset-top)); gap: 8px; }
        .brand { padding: 8px 10px; }
        .brand strong { font-size: 11px; }
        .brand span { font-size: 9px; }
        .readout { max-width: 64vw; padding: 8px 9px; font-size: 10px; }
        .map-frame { right: 9px; bottom: calc(138px + env(safe-area-inset-bottom)); padding: 4px; }
        #minimap { width: 94px; height: 94px; }
        .controls { display: none; }
        .debug { left: 10px; top: 72px; max-width: 62vw; font-size: 9px; }
        .mobile-controls { display: block; position: fixed; z-index: 4; inset: auto 0 0; height: calc(132px + env(safe-area-inset-bottom)); padding: 10px 14px max(14px, env(safe-area-inset-bottom)); pointer-events: none; }
        #move-stick { position: absolute; left: 20px; bottom: max(18px, env(safe-area-inset-bottom)); width: 104px; height: 104px; border: 1px solid rgba(238,255,229,.34); border-radius: 50%; background: rgba(15,29,34,.52); box-shadow: inset 0 0 25px rgba(135,255,155,.08); touch-action: none; pointer-events: auto; }
        #stick-knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border: 1px solid rgba(255,255,255,.5); border-radius: 50%; background: rgba(171,255,142,.58); box-shadow: 0 3px 12px rgba(0,0,0,.3); }
        #touch-actions { position: absolute; right: 12px; bottom: max(16px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, 58px); gap: 7px; pointer-events: auto; }
        #touch-actions button { min-height: 43px; border: 1px solid rgba(239,255,231,.38); border-radius: 14px; background: rgba(20,38,40,.76); color: #efffe0; font-size: 10px; font-weight: 700; touch-action: none; box-shadow: 0 4px 12px rgba(0,0,0,.24); }
        #touch-actions button:active { background: rgba(140,229,118,.55); }
      }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="Playable procedural ragdoll world"></canvas>
    <header class="topbar">
      <div class="brand"><strong>PROC/GEN</strong><span>painterly physics playground</span></div>
      <div class="readout">
        <div id="status">Preparing the world…</div>
        <div class="header-actions">
          <button class="small-button" id="pause-button" type="button">Pause · P</button>
          <button class="small-button" id="new-arena" type="button">New world · N</button>
        </div>
      </div>
    </header>
    <pre id="debug" class="debug">Starting direct WebGL renderer…</pre>
    <div id="banner" hidden></div>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="map-frame"><canvas id="minimap" width="168" height="168" aria-label="Arena map"></canvas></div>
    <aside class="controls">
      <strong>Move</strong> WASD · <strong>run</strong> Shift · <strong>jump</strong> Space · <strong>fire / throw</strong> click<br />
      <strong>fight</strong> F punch · K kick · G carry ball · R go limp / recover<br />
      <strong>world</strong> drag to look · wheel zoom · E add people · H hostility · V waves · P pause · ` detail
    </aside>
    <div class="mobile-controls" aria-label="Touch controls">
      <div id="move-stick" aria-label="Move joystick"><div id="stick-knob"></div></div>
      <div id="touch-actions">
        <button type="button" data-action="shoot" aria-label="Fire or throw">FIRE</button>
        <button type="button" data-hold="Space" aria-label="Jump">JUMP</button>
        <button type="button" data-action="punch" aria-label="Punch">PUNCH</button>
        <button type="button" data-action="kick" aria-label="Kick">KICK</button>
        <button type="button" data-action="ball" aria-label="Pick up or drop ball">BALL</button>
      </div>
    </div>
    <div id="fault" role="alert" hidden></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
