<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17202b" />
    <title>proc-gen · raw WebGL foundation</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101720; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .panel {
        position: fixed; left: 16px; top: 16px; max-width: min(520px, calc(100vw - 32px));
        padding: 14px 16px; border: 1px solid #ffffff24; border-radius: 12px;
        background: #111923d9; color: #f7f3dc; box-shadow: 0 10px 34px #0006;
        backdrop-filter: blur(10px); pointer-events: none;
      }
      h1 { margin: 0 0 6px; color: #ffd16a; font-size: 16px; font-weight: 700; letter-spacing: .03em; }
      p { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #d2dccf; }
      #detail { color: #9ebbb1; }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="Interactive raw WebGL procedural grove"></canvas>
    <section class="panel" aria-live="polite">
      <h1>Painterly grove · graphics foundation</h1>
      <p id="message">Starting raw WebGL 2…</p>
      <p id="detail">Drag to orbit · wheel or pinch to zoom</p>
    </section>
    <script type="module" src="/src/graphics-lab.js"></script>
  </body>
</html>
